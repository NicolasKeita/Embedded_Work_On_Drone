# Hardware configuration loaded by hil_runner before STM32 discovery.
# Use two Nucleo-L476RG boards with STM32L476RG microcontrollers, matching
# the FC1/FC2 firmware target (nucleo_l476rg) and the documented UART wiring.
# Changing a serial number does not make firmware compatible with another STM32 model.
# Replace these ST-LINK USB serial numbers with those of your own FC1 and FC2 boards.
# Both values must contain 24 hexadecimal characters and identify different boards.
# On Linux, find them in /dev/serial/by-id/usb-STMicroelectronics_STM32_STLink_<serial>-if02.
fc1_stlink_serial = 066FFF525771555067225635
fc2_stlink_serial = 066CFF525771555067193653
