# NOMINAL-014: shared SIL/HIL mission profile, loaded once by the host runners.
# The scenario ID, description and fault kind remain fixed in code.
# These files do not configure the STM32 firmware.
# Values use SI units; zero station/sensor/report overrides retain runner defaults.
# Tracking tolerance controls the applicable SIL tracking metrics and checks.
# HIL verdict and independent safety limits do not use this tolerance.
target_x_m = 0
target_y_m = -4
target_z_m = 7
duration_s = 30
tracking_tolerance_m = 0.75
station_hold_s = 0
sensor_max_altitude_m = 0
report_period_s = 0
wind_x_mps = 0
wind_y_mps = 0
wind_gust_period_s = 0
wind_start_s = 8
wind_end_s = 24
