# Host SIL runner only. Files are read once before simulation begins.
# Canonical scenarios override mission target, duration and explicit profile settings.
# CLI --telemetry-period and --verbose take priority over reporting settings.
dt_s = 0.01
seed = 42
transport_latency_s = 0.004
telemetry_rate_hz = 20
trace_level = info
heartbeat_timeout_s = 0.10
actuator_mismatch_rpm = 60
thrust_compensation_margin = 1.7
sensor_max_altitude_m = 500
sensor_max_position_m = 1000
report_period_s = 1
steady_window_s = 10
viewer_enabled = true
viewer_period_s = 0.05
viewer_replay_max_delay_s = 0.1
viewer_max_samples = 600

# Emulated controller only; these settings do not reconfigure STM32 firmware.
controller.kp_altitude = 5
controller.ki_altitude = 0.05
controller.kd_altitude = 24
controller.max_integral_rpm = 60
controller.kp_position = 1
controller.kd_position = 5.1
controller.kp_attitude = 0.8
controller.max_tilt_deg = 15
controller.min_rpm = 300
controller.max_rpm = 12000
controller.altitude_tolerance_m = 0.5
controller.position_tolerance_m = 1
controller.station_hold_seconds = 5
controller.spin_up_seconds = 3
controller.takeoff_transition_seconds = 12
controller.climb_speed_mps = 0.617
controller.vertical_speed_gain = 1.5
