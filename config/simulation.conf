# Host-only simulation parameters: loaded once before starting SIL/HIL or Monte Carlo.
# These values configure the simulated plant, never the FC1/FC2 firmware.
# Missing keys use the nominal values below; unknown keys and invalid values are errors.
# HIL still uses the gains and limits compiled into the connected firmware.

# Aircraft model. Lift is lift_coefficient * RPM^2 in newtons.
# Hover RPM is derived from mass_kg * gravity_mps2 / lift_coefficient.
aircraft.mass_kg = 1.2
aircraft.gravity_mps2 = 9.81
aircraft.lift_coefficient = 1.77e-5
aircraft.pitch_target_gain_rad_per_deg = 0.01
aircraft.roll_target_gain_rad_per_deg = 0.01
aircraft.pitch_acceleration_gain_mps2_per_rad = 9.81
aircraft.roll_acceleration_gain_mps2_per_rad = 9.81
aircraft.attitude_time_constant_s = 0.25
aircraft.wind_gain_per_s = 0.08
aircraft.minimum_rpm = 0.0
aircraft.maximum_rpm = 12000.0
aircraft.minimum_servo_deg = -30.0
aircraft.maximum_servo_deg = 30.0

# Monte Carlo distribution scales; the seed and draw order remain deterministic.
# *_std values scale a centered normal distribution. Nonnegative quantities use
# the absolute draw: lag, wind speed, IMU noise scales, and GPS latency jitter.
# Fractional mass/gain scales are limited to [0, 0.25].
# Turbulence is uniform in [0, maximum]; atmospheric offsets are uniform in +/- maximum.
# Some dispersion fields are recorded for analysis and are extension points for
# the simplified model; configuring them does not add new physical effects.
dispersion.mass_variation_std = 0.05
dispersion.cog_offset_x_std_m = 0.05
dispersion.cog_offset_y_std_m = 0.05
dispersion.cog_offset_z_std_m = 0.02
dispersion.actuator_gain_std = 0.025
dispersion.actuator_lag_std_s = 0.025
dispersion.wind_speed_std_mps = 2.0
dispersion.turbulence_maximum = 0.5
dispersion.atmospheric_density_maximum_offset = 0.02
dispersion.atmospheric_pressure_maximum_offset = 0.02
dispersion.imu_accel_noise_scale_mps2 = 0.05
dispersion.imu_gyro_noise_scale_radps = 0.005
dispersion.barometer_bias_std_m = 0.1
dispersion.barometer_drift_std_mps = 0.001
dispersion.gps_latency_jitter_std_s = 0.01
