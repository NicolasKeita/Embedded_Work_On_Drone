<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8e3b73"/>
    </marker>
  </defs>

  <title>Distributed Flight Control and Safety Testbed — current architecture</title>
  <desc>Single deterministic engine: Aircraft -> Sensors -> FC1 -> Actuators -> Aircraft closed loop, supervised by FC2 (HealthMonitor + SafetyManager) over a simulated in-process CommsBus. SIL, Monte Carlo and HIL runners are external test infrastructure. HIL uses a host FC emulator over a loopback transport; no physical STM32 yet.</desc>

  <text x="490" y="26" text-anchor="middle" font-size="17" font-weight="bold">Distributed Flight Control and Safety Testbed — Current Architecture</text>
  <text x="490" y="45" text-anchor="middle" font-size="12" fill="#555">single deterministic engine (flight_sim_core) · in-process simulated comms · host FC emulator for HIL</text>

  <rect x="40" y="70" width="900" height="370" rx="10" fill="#f4f7fb" stroke="#7aa3c3" stroke-width="1.2" stroke-dasharray="6 4" />
  <text x="56" y="92" font-size="12" font-weight="bold" fill="#2a5b7c">Flight software (one process)</text>

  <rect x="360" y="105" width="260" height="46" rx="8" fill="#dbe7f3" stroke="#2a5b7c" stroke-width="1.6"/>
  <text x="490" y="129" text-anchor="middle" font-weight="bold">Aircraft Model</text>
  <text x="490" y="143" text-anchor="middle" font-size="11" fill="#444">Aircraft · PhysicsDispersion (ground truth)</text>

  <rect x="360" y="180" width="260" height="46" rx="8" fill="#eef2f7" stroke="#2a5b7c" stroke-width="1.6"/>
  <text x="490" y="200" text-anchor="middle" font-weight="bold">Sensors (Telemetry)</text>
  <text x="490" y="216" text-anchor="middle" font-size="11" fill="#444">SensorTelemetry — only data FC1 sees</text>

  <rect x="360" y="255" width="260" height="56" rx="8" fill="#dcefe0" stroke="#2e7d4f" stroke-width="1.8"/>
  <text x="490" y="276" text-anchor="middle" font-weight="bold">FC1 — FlightController</text>
  <text x="490" y="292" text-anchor="middle" font-size="11" fill="#234">cascaded PID (alt/X/Y) + mission FSM</text>
  <text x="490" y="304" text-anchor="middle" font-size="11" fill="#234">ControlCommand + sequenced heartbeat</text>

  <rect x="360" y="335" width="260" height="46" rx="8" fill="#eef2f7" stroke="#2a5b7c" stroke-width="1.6"/>
  <text x="490" y="355" text-anchor="middle" font-weight="bold">Actuators</text>
  <text x="490" y="371" text-anchor="middle" font-size="11" fill="#444">efficiency + thrust margin · physics step</text>

  <rect x="710" y="255" width="200" height="126" rx="8" fill="#fde9e6" stroke="#b02a2a" stroke-width="1.8"/>
  <text x="810" y="276" text-anchor="middle" font-weight="bold">FC2 — Supervision</text>
  <rect x="724" y="284" width="172" height="42" rx="6" fill="#fff" stroke="#b02a2a" stroke-width="1"/>
  <text x="810" y="301" text-anchor="middle" font-size="12" font-weight="bold">HealthMonitor</text>
  <text x="810" y="316" text-anchor="middle" font-size="10" fill="#444">detection (agnostic)</text>
  <rect x="724" y="332" width="172" height="42" rx="6" fill="#fff" stroke="#b02a2a" stroke-width="1"/>
  <text x="810" y="349" text-anchor="middle" font-size="12" font-weight="bold">SafetyManager</text>
  <text x="810" y="364" text-anchor="middle" font-size="10" fill="#444">diagnosis → action</text>

  <rect x="650" y="272" width="52" height="30" rx="6" fill="#fff3cf" stroke="#9a7b16" stroke-width="1.4"/>
  <text x="676" y="291" text-anchor="middle" font-size="11" font-weight="bold">CommsBus</text>

  <rect x="80" y="255" width="160" height="56" rx="8" fill="#fbe3f1" stroke="#8e3b73" stroke-width="1.6"/>
  <text x="160" y="278" text-anchor="middle" font-weight="bold">Fault Injector</text>
  <text x="160" y="294" text-anchor="middle" font-size="10" fill="#444">alt sensor / FC1 liveness /</text>
  <text x="160" y="305" text-anchor="middle" font-size="10" fill="#444">comms / actuator efficiency</text>
  <line x1="490" y1="151" x2="490" y2="178" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="498" y="168" font-size="10" fill="#555">truth</text>
  <line x1="490" y1="226" x2="490" y2="253" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="498" y="243" font-size="10" fill="#555">sensors</text>
  <line x1="490" y1="311" x2="490" y2="333" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="498" y="324" font-size="10" fill="#555">command</text>
  <path d="M620,358 C 700,358 700,128 622,128" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="668" y="250" font-size="10" fill="#555">integrate</text>

  <line x1="240" y1="278" x2="358" y2="203" stroke="#8e3b73" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrr)"/>
  <line x1="240" y1="290" x2="358" y2="284" stroke="#8e3b73" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrr)"/>
  <text x="250" y="236" font-size="10" fill="#8e3b73">inject</text>

  <line x1="620" y1="283" x2="648" y2="285" stroke="#1f6feb" stroke-width="1.5" marker-end="url(#arrb)"/>
  <line x1="702" y1="287" x2="708" y2="287" stroke="#1f6feb" stroke-width="1.5" marker-end="url(#arrb)"/>
  <path d="M710,330 C 680,330 660,300 622,300" fill="none" stroke="#1f6feb" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrb)"/>
  <text x="635" y="322" font-size="10" fill="#1f6feb">SafetyCommand</text>

  <rect x="40" y="476" width="900" height="120" rx="10" fill="#f7f7f2" stroke="#8a8a78" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="56" y="498" font-size="12" font-weight="bold" fill="#5c5c45">Test infrastructure (external drivers — not flight software)</text>

  <rect x="70" y="512" width="200" height="66" rx="8" fill="#eef7ec" stroke="#4f7a45" stroke-width="1.6"/>
  <text x="170" y="534" text-anchor="middle" font-weight="bold">SIL_RUNNER</text>
  <text x="170" y="550" text-anchor="middle" font-size="10" fill="#444">max CPU speed · fixed step</text>
  <text x="170" y="564" text-anchor="middle" font-size="10" fill="#444">6 deterministic fault scenarios</text>

  <rect x="300" y="512" width="200" height="66" rx="8" fill="#eef3fb" stroke="#3a5b9a" stroke-width="1.6"/>
  <text x="400" y="534" text-anchor="middle" font-weight="bold">SIL_MONTE_CARLO</text>
  <text x="400" y="550" text-anchor="middle" font-size="10" fill="#444">seeded dispersion campaign</text>
  <text x="400" y="564" text-anchor="middle" font-size="10" fill="#444">control-quality statistics</text>

  <rect x="530" y="512" width="240" height="66" rx="8" fill="#fdeede" stroke="#a06a1e" stroke-width="1.6"/>
  <text x="650" y="534" text-anchor="middle" font-weight="bold">HIL_RUNNER</text>
  <text x="650" y="550" text-anchor="middle" font-size="10" fill="#444">100 Hz wall-clock paced</text>
  <text x="650" y="564" text-anchor="middle" font-size="10" fill="#444">host FC emulator (loopback) — no STM32 yet</text>

  <rect x="790" y="512" width="130" height="66" rx="8" fill="#fff" stroke="#8a8a78" stroke-width="1.2"/>
  <text x="855" y="534" text-anchor="middle" font-weight="bold">FMECA</text>
  <text x="855" y="550" text-anchor="middle" font-size="10" fill="#444">failure analysis</text>
  <text x="855" y="564" text-anchor="middle" font-size="10" fill="#444">docs/fmeca/fmeca.md</text>

  <line x1="170" y1="512" x2="420" y2="392" stroke="#5c5c45" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arr)"/>
  <line x1="400" y1="512" x2="455" y2="392" stroke="#5c5c45" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arr)"/>
  <line x1="650" y1="512" x2="510" y2="392" stroke="#5c5c45" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arr)"/>
  <text x="455" y="450" font-size="10" fill="#5c5c45">drives the same flight_sim_core engine</text>
</svg>

